<section id="home" 
         class="grid grid-cols-12"
         role="banner"
         aria-label="Hero section">
  <div class="col-span-12">
    <div class="banner-image-container">
      <img ngSrc="assets/images/icons/banner-technology.png" 
           alt="Technology innovation background imagery" 
           [priority]="true"
           fill 
           class="object-cover" 
           sizes="100vw">
      <div class="container relative z-10">
        <div class="h-[100vh] flex flex-col justify-end pb-20 gap-4">
          <h1 class="text-2xl md:text-7xl font-medium text-white tracking-wide"
              role="heading"
              aria-level="1">
            {{ 'banner.title.part1' | translate }} <br class="block md:hidden" />
            <span class="block">{{ 'banner.title.part2' | translate }}</span>
          </h1>

          <p class="md:text-lg text-sm text-natural-6000 w-full max-w-full"
             role="text"
             aria-describedby="banner-description">
            {{ 'banner.subtitle.line1' | translate }}
            <br>
            {{ 'banner.subtitle.line2' | translate }}
          </p>
          <span id="banner-description" class="sr-only">
            Company mission statement and vision
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
