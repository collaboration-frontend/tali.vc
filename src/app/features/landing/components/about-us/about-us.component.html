<section id="about" 
         class="container lg:py-10 py-4"
         role="region"
         aria-labelledby="about-heading">
  <div class="grid grid-cols-12 gap-4">
    <div class="col-span-12 lg:col-span-7 self-center">
      <h2 id="about-heading" class="sr-only">
        {{ 'about.title' | translate }}
      </h2>
      <p class="md:text-2xl text-sm font-medium text-primary-100 break-words pe-0 lg:pe-40 tracking-wide"
         role="text"
         aria-describedby="about-heading">
        {{ 'about.intro' | translate }}
      </p>
    </div>
    <div class="col-span-12 lg:col-span-5" 
         role="img"
         [attr.aria-label]="'about.image.alt' | translate">
      <img class="w-full object-cover" 
           src="assets/images/icons/img-ventures.png" 
           [alt]="'about.image.alt' | translate"
           loading="lazy">
    </div>
  </div>
</section>
