<section class="container"
         role="region"
         aria-labelledby="investment-focus-heading">
  <div class="grid grid-cols-12 gap-4 lg:py-10 py-4">
    <div class="col-span-12 mb-8">
      <div class="flex flex-col gap-4">
        <h2 id="investment-focus-heading" 
            class="md:text-4xl text-2xl font-medium text-extended-black"
            role="heading"
            aria-level="2">
          {{ 'investmentFocus.title' | translate }}
        </h2>
        <p class="text-extended-grey text-base font-normal"
           aria-describedby="investment-focus-heading">
          {{ 'investmentFocus.subtitle' | translate }}
        </p>
      </div>
    </div>
    <div class="col-span-12 lg:col-span-7">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 lg:gap-4"
           role="grid"
           [attr.aria-label]="'investmentFocus.accessibility.areasGrid' | translate">
        @for (area of focusAreas; track area.id) {
        <button (click)="selectArea(area)" 
                (keydown.Enter)="selectArea(area)"
                (keydown.Space)="selectArea(area)"
                [attr.aria-pressed]="selectedArea?.id === area.id"
                [attr.aria-describedby]="'area-desc-' + area.id"
                class="p-4 lg:p-5 border border-natural-1000 cursor-pointer bg-white flex flex-col items-start gap-4 justify-center text-center min-h-[100px] lg:min-h-[120px]
                     hover:bg-primary hover:text-white group transition-colors duration-1000 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-100 focus-visible:ring-offset-2"
                role="gridcell">
          <img [src]="area.icon || 'assets/icons/FinTech-icon.svg'" 
               [alt]=""
               aria-hidden="true"
               class="w-8 h-8 lg:w-10 lg:h-10 mb-3 transition-colors duration-1000 group-hover:filter group-hover:invert group-hover:brightness-0 group-hover:contrast-200">
          <span class="text-primary-100 text-xs lg:text-base font-light transition-colors duration-1000 group-hover:text-white">
            {{ area.labelKey | translate }}
          </span>
          <span [id]="'area-desc-' + area.id" class="sr-only">
            {{ 'investmentFocus.accessibility.selectArea' | translate }} {{ area.labelKey | translate }}
          </span>
        </button>
        }
      </div>
    </div>
    <div class="col-span-12 lg:col-span-5">
      <div class="image-container" 
           role="img"
           [attr.aria-label]="selectedArea ? (selectedArea.labelKey | translate) + ' ' + ('investmentFocus.accessibility.focusArea' | translate) : ('investmentFocus.accessibility.defaultImage' | translate)">
        <img ngSrc="{{selectedArea?.imageUrl || 'assets/images/focus-image.png'}}"
             [alt]="selectedArea ? (selectedArea.labelKey | translate) + ' focus area illustration' : 'Investment focus illustration'"
             fill
             loading="lazy"
             class="object-cover">
      </div>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-4 lg:py-10"
       role="region"
       aria-labelledby="investment-approach-heading">
    <div class="col-span-12">
      <h3 id="investment-approach-heading" class="sr-only">
        {{ 'investmentFocus.accessibility.approachTitle' | translate }}
      </h3>
      <div class="preview-grid">
        <app-investment-focus-preview-item-card />
      </div>
    </div>
    <div class="focus-cards col-span-12 lg:col-span-4">
      <app-investment-focus-item-card [title]="('investmentFocus.cards.earlyStage' | translate)"
        [subTitle]="('investmentFocus.cards.earlyStageSub' | translate)" 
        icon="assets/icons/Early-icon.svg" />
    </div>
    <div class="focus-cards col-span-12 lg:col-span-4">
      <app-investment-focus-item-card [title]="('investmentFocus.cards.techAndDigital' | translate)"
        [subTitle]="('investmentFocus.cards.techAndDigitalSub' | translate)" 
        icon="assets/icons/ai_techn.svg" />
    </div>
    <div class="focus-cards col-span-12 lg:col-span-4">
      <app-investment-focus-item-card [title]="('investmentFocus.cards.regionalGlobal' | translate)"
        [subTitle]="('investmentFocus.cards.regionalGlobalSub' | translate)" 
        icon="assets/icons/bag.svg" />
    </div>
  </div>
</section>
